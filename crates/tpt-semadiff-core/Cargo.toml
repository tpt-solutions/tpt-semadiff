[package]
name = "tpt-semadiff-core"
description = "Structural, AST-aware diffing engine behind tpt-semadiff"
readme = "README.md"
keywords = ["diff", "ast", "tree-sitter", "semantic-diff", "parser"]
categories = ["development-tools", "parser-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
serde.workspace = true
serde_json.workspace = true
similar = "3"
ureq = { version = "3", features = ["json"], optional = true }

[features]
# Off by default, so the offline build does not pull in an HTTP client.
llm = ["dep:ureq"]
