[workspace]
resolver = "2"
members = [
    "crates/tpt-semadiff-core",
    "crates/tpt-semadiff-cli",
    "crates/tpt-semadiff-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-semadiff"

[workspace.dependencies]
tpt-semadiff-core = { path = "crates/tpt-semadiff-core", version = "0.1.0" }
tpt-semadiff-tui = { path = "crates/tpt-semadiff-tui", version = "0.1.0" }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
