name: Publish to crates.io

# Runs when a version tag is pushed (for example v0.1.0). Publishes in dependency order.
# Needs the CARGO_REGISTRY_TOKEN repository secret.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the workspace version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Publish tpt-semadiff-core
        run: cargo publish -p tpt-semadiff-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for the index to pick up core
        run: sleep 60
      - name: Publish tpt-semadiff-tui
        run: cargo publish -p tpt-semadiff-tui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for the index to pick up tui
        run: sleep 60
      - name: Publish tpt-semadiff-cli
        run: cargo publish -p tpt-semadiff-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
